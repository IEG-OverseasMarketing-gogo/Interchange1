<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纽约时报中文网 리딩 워크북</title>
<style>
  :root{
    --navy:#1b2a4a; --blue:#2f6fed; --blue-light:#eaf0ff;
    --gray:#5c6472; --line:#dfe4ec; --bg:#f6f7fb;
    --green:#2f9e5c; --amber:#d98a1e; --red:#d94f4f;
  }
  *{box-sizing:border-box;}
  html{font-size:17px;}
  body{margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:#20242c; line-height:1.6;}
  header{background:linear-gradient(135deg,var(--navy),#2c3e6b); color:#fff; padding:20px 20px; display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;}
  header h1{margin:0; font-size:1.25rem;}
  header p{margin:4px 0 0; color:#c6d0ea; font-size:0.82rem;}
  .gear-btn{background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:10px; padding:9px 13px; font-size:0.85rem; cursor:pointer;}
  main{max-width:760px; margin:0 auto; padding:20px 16px 90px;}

  .card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px;}
  .card h2{margin:0 0 12px; font-size:1.05rem; color:var(--navy);}
  label{display:block; font-weight:700; margin:14px 0 6px; color:var(--navy); font-size:0.92rem;}
  select, input[type=date], textarea{width:100%; font-size:0.95rem; padding:11px 13px; border-radius:10px; border:2px solid var(--line); font-family:inherit; background:#fbfcfe;}
  textarea{min-height:65px; resize:vertical;}

  .week-title{font-size:1.1rem; font-weight:800; color:var(--navy); margin:2px 0 2px;}
  .week-sub{color:var(--gray); font-size:0.85rem; margin-bottom:6px;}
  a.src-link{font-size:0.82rem; color:var(--blue); text-decoration:none;}
  a.src-link:hover{text-decoration:underline;}

  .task-item{display:flex; align-items:flex-start; gap:12px; padding:13px 12px; border:2px solid var(--line); border-radius:12px; margin-bottom:10px; background:#fbfcfe;}
  .task-item.checked{border-color:var(--green); background:#effaf2;}
  .task-item input[type=checkbox]{width:24px; height:24px; margin-top:2px; accent-color:var(--green); cursor:pointer;}
  .task-item .t-main{font-size:0.95rem; font-weight:600;}
  .task-item .t-sub{font-size:0.8rem; color:var(--gray); margin-top:2px;}

  .rating-row{display:flex; gap:8px; justify-content:space-between;}
  .rating-btn{flex:1; padding:13px 4px; border-radius:12px; border:2px solid var(--line); background:#fff; font-size:1.3rem; text-align:center; cursor:pointer;}
  .rating-btn .lbl{display:block; font-size:0.65rem; margin-top:4px; color:var(--gray); font-weight:600;}
  .rating-btn.active{border-color:var(--blue); background:var(--blue-light);}

  .progress-bar-outer{background:var(--line); border-radius:20px; height:13px; overflow:hidden; margin-top:8px;}
  .progress-bar-inner{background:var(--blue); height:100%; border-radius:20px; transition:width .3s;}
  .progress-label{font-size:0.82rem; color:var(--gray); margin-top:6px;}

  .submit-btn{width:100%; padding:17px; font-size:1.05rem; font-weight:800; color:#fff; background:var(--blue); border:none; border-radius:14px; cursor:pointer; margin-top:6px;}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:14px 22px; border-radius:30px; font-size:0.92rem; box-shadow:0 6px 18px rgba(0,0,0,.25); display:none; z-index:50; text-align:center; max-width:90%;}
  .sync-status{font-size:0.78rem; margin-top:4px;}
  .sync-status.ok{color:var(--green);}
  .sync-status.warn{color:var(--amber);}

  table.history{width:100%; border-collapse:collapse; font-size:0.8rem; margin-top:8px;}
  table.history th, table.history td{border:1px solid var(--line); padding:6px 7px; text-align:center;}
  table.history th{background:var(--blue-light); color:var(--navy);}

  details.vocab-detail{margin-top:10px;}
  details.vocab-detail summary{cursor:pointer; font-weight:700; color:var(--blue); font-size:0.88rem; padding:6px 0;}
  table.vocab-check{width:100%; border-collapse:collapse; font-size:0.83rem; margin-top:6px;}
  table.vocab-check td{border:1px solid var(--line); padding:6px 7px; vertical-align:middle;}
  table.vocab-check td.chk{width:32px; text-align:center;}
  table.vocab-check input[type=checkbox]{width:19px; height:19px; accent-color:var(--green);}
  .speak-all-btn{border:none; background:var(--navy); color:#fff; border-radius:20px; padding:6px 13px; font-size:0.78rem; cursor:pointer; margin:8px 0 4px;}
  .speak-btn{border:none; background:var(--blue-light); color:var(--blue); border-radius:50%; width:28px; height:28px; font-size:13px; cursor:pointer; flex:0 0 auto;}
  .speak-btn.playing{background:var(--blue); color:#fff;}
  .word-cell{display:flex; align-items:center; gap:7px;}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; align-items:center; justify-content:center; padding:20px;}
  .modal-bg.open{display:flex;}
  .modal{background:#fff; border-radius:16px; padding:22px; max-width:460px; width:100%; max-height:85vh; overflow:auto;}
  .modal h3{margin-top:0; color:var(--navy);}
  .modal .field{margin-bottom:14px;}
  .modal input[type=text]{width:100%; padding:11px 12px; border-radius:9px; border:2px solid var(--line); font-size:0.92rem;}
  .modal .btn-row{display:flex; gap:10px; margin-top:16px;}
  .modal button{flex:1; padding:12px; border-radius:10px; border:none; font-size:0.92rem; font-weight:700; cursor:pointer;}
  .modal .save{background:var(--blue); color:#fff;}
  .modal .close{background:var(--line); color:var(--navy);}
  .hint{font-size:0.76rem; color:var(--gray); margin-top:4px;}
</style>
</head>
<body>

<header>
  <div>
    <h1>📰 纽约时报中文网 리딩 워크북</h1>
    <p>16주 중고급 뉴스 리딩 자가학습 · 켈리</p>
  </div>
  <button class="gear-btn" onclick="openSettings()">⚙️ 설정</button>
  <button class="gear-btn" onclick="diagnoseTTS()">🔍 음성 진단</button>
</header>

<main>
  <div class="card">
    <h2>📅 오늘 학습</h2>
    <label>학습 날짜</label>
    <input type="date" id="classDate">
    <label>주차 / 기사 선택</label>
    <select id="weekSelect"></select>
  </div>

  <div class="card" id="weekCard">
    <div class="week-title" id="weekTitle"></div>
    <div class="week-sub" id="weekSub"></div>
    <a class="src-link" id="srcLink" href="#" target="_blank">🔗 원문 기사 열기</a>

    <div id="taskList" style="margin-top:14px;"></div>

    <details class="vocab-detail">
      <summary>📖 예습 단어 개별 체크 펼치기</summary>
      <button class="speak-all-btn" onclick="speakAllVocab()">🔊 단어 전체 듣기</button>
      <table class="vocab-check" id="vocabTable"></table>
    </details>

    <details class="vocab-detail">
      <summary>💬 표현 패턴 보기</summary>
      <table class="vocab-check" id="exprTable"></table>
    </details>

    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progBar" style="width:0%"></div></div>
    <div class="progress-label" id="progLabel">완료 0 / 0 (0%)</div>
  </div>

  <div class="card">
    <h2>⭐ 오늘의 이해도 / 성취도</h2>
    <div class="rating-row" id="ratingRow"></div>
  </div>

  <div class="card">
    <h2>📝 자가 평가</h2>
    <label>👍 오늘 잘한 점 (예: 새 단어 습득, 문장 구조 이해 등)</label>
    <textarea id="strengths" placeholder="예: 정치·외교 관련 어휘가 익숙해졌어요"></textarea>
    <label>🔧 더 학습이 필요한 점</label>
    <textarea id="improvement" placeholder="예: 문장이 길어지면 구조 파악이 어려워요"></textarea>
  </div>

  <button class="submit-btn" onclick="submitRecord()">✔️ 오늘 기록 저장 &amp; 구글시트 전송</button>
  <div class="sync-status" id="syncStatus"></div>

  <div class="card">
    <h2>📊 최근 기록</h2>
    <table class="history" id="historyTable"></table>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>⚙️ 워크북 설정</h3>
    <div class="field">
      <label>Google Apps Script 웹앱 URL</label>
      <input type="text" id="webhookUrl" placeholder="https://script.google.com/macros/s/xxxx/exec">
      <div class="hint">시니어반 워크북과 같은 Apps Script 코드를 재사용할 수 있어요. 같은 시트에 이어서 기록하려면 같은 URL을, 별도 시트로 관리하려면 새 구글시트에 같은 코드를 붙여넣고 새 URL을 입력하세요.</div>
    </div>
    <div class="btn-row">
      <button class="close" onclick="closeSettings()">닫기</button>
      <button class="save" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<script>
/* ===================== 데이터: 16주 커리큘럼 (요약) ===================== */

 vocab:[["女权运动","nǚquán yùndòng","여성 인권 운동"],["标志性人物","biāozhìxìng rénwù","상징적 인물"],["逝世/去世","shìshì / qùshì","별세하다"],["享年","xiǎngnián","향년"],["先驱","xiānqū","선구자"],["平权","píngquán","평등권"],["遗产","yíchǎn","유산"],["悼念","dàoniàn","애도하다"]],

const RATINGS = [
  {v:1, emoji:"😣", label:"많이 어려웠음"},
  {v:2, emoji:"😕", label:"조금 힘들었음"},
  {v:3, emoji:"🙂", label:"보통"},
  {v:4, emoji:"😀", label:"잘 이해함"},
  {v:5, emoji:"🤩", label:"수월했음"}
];

/* ===================== 상태 ===================== */
let settings = JSON.parse(localStorage.getItem('nyt_workbook_settings') || '{}');
if(!settings.webhookUrl) settings.webhookUrl = "";

let currentWeekIdx = 0;
let ratingState = null;
let checkedTasks = {read:false, vocabAll:false, exprSeen:false};
let vocabChecks = {};

function historyKey(){ return 'nyt_workbook_history'; }
function getHistory(){ return JSON.parse(localStorage.getItem(historyKey()) || '[]'); }
function saveHistory(arr){ localStorage.setItem(historyKey(), JSON.stringify(arr)); }

/* ===================== TTS ===================== */
let ttsVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  ttsVoice = voices.find(v=>v.lang==='zh-CN') || voices.find(v=>v.lang && v.lang.startsWith('zh')) || null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
  setInterval(()=>{ if(speechSynthesis.paused) speechSynthesis.resume(); }, 4000);
}
let _ttsKeepAlive = null;
function speak(text, btnEl, _isRetry){
  if(!('speechSynthesis' in window)) return;
  if(speechSynthesis.paused) speechSynthesis.resume();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 0.85;
  u.pitch = 1;
  u.volume = 1;
  if(ttsVoice) u.voice = ttsVoice;
  _ttsKeepAlive = u; // iOS Safari 버그 방지: 재생 전 가비지 컬렉션되는 것을 막기 위해 참조 유지
  if(btnEl){
    document.querySelectorAll('.speak-btn.playing').forEach(b=>b.classList.remove('playing'));
    btnEl.classList.add('playing');
  }
  u.onend = ()=>{ if(btnEl) btnEl.classList.remove('playing'); };
  u.onerror = ()=>{
    if(btnEl) btnEl.classList.remove('playing');
    if(!_isRetry){ setTimeout(()=> speak(text, btnEl, true), 250); } // 1회 자동 재시도
  };
  speechSynthesis.speak(u);
}
function speakAllVocab(){
  const w = WEEKS[currentWeekIdx];
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utterances = w.vocab.map(v=>{
    const u = new SpeechSynthesisUtterance(v[0]);
    u.lang='zh-CN'; u.rate=0.85; u.volume=1; if(ttsVoice) u.voice = ttsVoice;
    return u;
  });
  _ttsKeepAlive = utterances; // 배열 전체를 참조 유지
  utterances.forEach(u=>speechSynthesis.speak(u));
}

/* ===================== 렌더링 ===================== */
function renderWeekSelect(){
  const sel = document.getElementById('weekSelect');
  sel.innerHTML = WEEKS.map((w,i)=>`<option value="${i}">Week ${i+1} · ${w.section}</option>`).join('');
  sel.value = currentWeekIdx;
  sel.onchange = ()=>{ currentWeekIdx = parseInt(sel.value); resetFormState(); renderWeekCard(); };
}

function renderWeekCard(){
  const w = WEEKS[currentWeekIdx];
  document.getElementById('weekTitle').textContent = `Week ${currentWeekIdx+1} · ${w.titleKr}`;
  document.getElementById('weekSub').textContent = w.section;
  document.getElementById('srcLink').href = w.url;
  document.getElementById('srcLink').textContent = w.url.includes('google.com/search')
    ? '🔍 구글에서 기사 검색 (정확한 링크 미확인)'
    : '🔗 원문 기사 열기';

  document.getElementById('taskList').innerHTML = `
    <div class="task-item" id="taskRead" onclick="toggleTask('read')">
      <input type="checkbox" id="cbRead" onclick="event.stopPropagation(); toggleTask('read')">
      <div><div class="t-main">원문 기사 읽기 완료</div><div class="t-sub">위 링크를 열어 실제 기사를 읽으셨나요?</div></div>
    </div>
    <div class="task-item" id="taskVocabAll" onclick="toggleTask('vocabAll')">
      <input type="checkbox" id="cbVocabAll" onclick="event.stopPropagation(); toggleTask('vocabAll')">
      <div><div class="t-main">예습 단어 ${w.vocab.length}개 다 익혔어요</div></div>
    </div>
    <div class="task-item" id="taskExprSeen" onclick="toggleTask('exprSeen')">
      <input type="checkbox" id="cbExprSeen" onclick="event.stopPropagation(); toggleTask('exprSeen')">
      <div><div class="t-main">표현 패턴 확인 및 문장 만들기 완료</div></div>
    </div>
  `;

  document.getElementById('vocabTable').innerHTML = w.vocab.map((v,i)=>`
    <tr><td class="chk"><input type="checkbox" id="vc${i}" onchange="onVocabCheck(${i})"></td>
    <td class="word-cell"><button class="speak-btn" onclick="speak('${v[0].replace(/'/g,"\\'")}', this)">🔊</button><span>${v[0]}</span></td>
    <td>${v[1]}</td><td>${v[2]}</td></tr>
  `).join('');

  document.getElementById('exprTable').innerHTML = w.expr.map(e=>`<tr><td>${e}</td></tr>`).join('');

  updateProgress();
}

function toggleTask(key){
  checkedTasks[key] = !checkedTasks[key];
  const idMap = {read:'Read', vocabAll:'VocabAll', exprSeen:'ExprSeen'};
  document.getElementById('cb'+idMap[key]).checked = checkedTasks[key];
  document.getElementById('task'+idMap[key]).classList.toggle('checked', checkedTasks[key]);
  updateProgress();
}
function onVocabCheck(i){
  vocabChecks[i] = document.getElementById('vc'+i).checked;
  updateProgress();
}

function updateProgress(){
  const w = WEEKS[currentWeekIdx];
  const totalVocab = w.vocab.length;
  const checkedVocab = Object.values(vocabChecks).filter(Boolean).length;
  const vocabDone = checkedTasks.vocabAll || (checkedVocab === totalVocab && totalVocab>0);

  const totalTasks = 3;
  let done = 0;
  if(checkedTasks.read) done++;
  if(vocabDone) done++;
  if(checkedTasks.exprSeen) done++;

  const pct = Math.round((done/totalTasks)*100);
  document.getElementById('progBar').style.width = pct+'%';
  document.getElementById('progLabel').textContent = `완료 ${done} / ${totalTasks} (${pct}%)`;
}

function renderRatingRow(){
  const el = document.getElementById('ratingRow');
  el.innerHTML = RATINGS.map(r=>`<div class="rating-btn" id="rate${r.v}" onclick="setRating(${r.v})">${r.emoji}<span class="lbl">${r.label}</span></div>`).join('');
}
function setRating(v){
  ratingState = v;
  RATINGS.forEach(r=>document.getElementById('rate'+r.v).classList.toggle('active', r.v===v));
}

function resetFormState(){
  ratingState = null;
  checkedTasks = {read:false, vocabAll:false, exprSeen:false};
  vocabChecks = {};
  document.getElementById('classDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('strengths').value = '';
  document.getElementById('improvement').value = '';
  renderWeekCard();
  renderRatingRow();
}

function renderHistory(){
  const hist = getHistory().slice(-8).reverse();
  const tbl = document.getElementById('historyTable');
  if(hist.length===0){ tbl.innerHTML = '<tr><td style="text-align:center; color:#999; padding:14px;">아직 기록이 없어요</td></tr>'; return; }
  tbl.innerHTML = `<tr><th>날짜</th><th>주차</th><th>완료율</th><th>이해도</th></tr>` +
    hist.map(h=>`<tr><td>${h.date}</td><td>W${h.week}</td><td>${h.pct}%</td><td>${'⭐'.repeat(h.rating)}</td></tr>`).join('');
}

/* ===================== 제출 & 구글시트 전송 ===================== */
async function submitRecord(){
  const w = WEEKS[currentWeekIdx];
  const date = document.getElementById('classDate').value;

  if(ratingState===null){ showToast('오늘의 이해도를 선택해 주세요.'); return; }

  const totalVocab = w.vocab.length;
  const checkedVocabCount = Object.values(vocabChecks).filter(Boolean).length;
  const vocabDone = checkedTasks.vocabAll || (checkedVocabCount === totalVocab && totalVocab>0);
  const totalTasks = 3;
  let done = 0;
  if(checkedTasks.read) done++;
  if(vocabDone) done++;
  if(checkedTasks.exprSeen) done++;
  const pct = Math.round((done/totalTasks)*100);

  const record = {
    student: "켈리",
    week: currentWeekIdx+1,
    unit: w.section + ' - ' + w.titleKr,
    date: date,
    attendance: true,
    completedCount: done,
    totalCount: totalTasks,
    pct: pct,
    rating: ratingState,
    strengths: document.getElementById('strengths').value.trim(),
    improvement: document.getElementById('improvement').value.trim(),
    vocabCheckedCount: checkedVocabCount,
    vocabTotal: totalVocab
  };

  const hist = getHistory();
  hist.push(record);
  saveHistory(hist);
  renderHistory();

  const statusEl = document.getElementById('syncStatus');
  if(settings.webhookUrl){
    try{
      await fetch(settings.webhookUrl, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify(record)
      });
      statusEl.textContent = '✅ 구글시트로 전송했어요';
      statusEl.className = 'sync-status ok';
    }catch(err){
      statusEl.textContent = '⚠️ 전송 실패 — 기록은 이 기기에 저장되어 있어요.';
      statusEl.className = 'sync-status warn';
    }
  }else{
    statusEl.textContent = '⚠️ 설정(⚙️)에서 구글시트 웹앱 URL을 등록해 주세요. 기록은 이 기기에 저장되었어요.';
    statusEl.className = 'sync-status warn';
  }
  showToast('오늘 기록이 저장되었습니다 🎉');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.style.display='none'; }, 3200);
}

/* ===================== 설정 ===================== */
function openSettings(){
  document.getElementById('webhookUrl').value = settings.webhookUrl;
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){ document.getElementById('settingsModal').classList.remove('open'); }
function saveSettings(){
  settings.webhookUrl = document.getElementById('webhookUrl').value.trim();
  localStorage.setItem('nyt_workbook_settings', JSON.stringify(settings));
  closeSettings();
  showToast('설정이 저장되었습니다.');
}

function diagnoseTTS(){
  if(!('speechSynthesis' in window)){
    alert('이 브라우저는 음성 합성(Web Speech API)을 지원하지 않습니다.');
    return;
  }
  const voices = speechSynthesis.getVoices();
  const zhVoices = voices.filter(v=>v.lang && v.lang.startsWith('zh'));
  let msg = `전체 음성 개수: ${voices.length}개\n중국어 음성: ${zhVoices.length}개\n`;
  if(zhVoices.length > 0){
    msg += zhVoices.map(v=>`- ${v.name} (${v.lang})`).join('\n');
  } else {
    msg += '\n중국어 음성이 설치되어 있지 않은 것 같아요.\n기기 설정에서 중국어 음성을 추가하거나, 다른 브라우저(Chrome/Safari 최신버전)로 시도해보세요.\n\n아이폰이라면 무음 스위치(측면 스위치)가 켜져 있는지도 확인해주세요 — 음성 합성 소리가 무음 스위치의 영향을 받을 수 있습니다.';
  }
  speak('你好，这是一个语音测试。', null);
  // 진단 정보는 음성 재생 시도 후 표시 (알림창이 사용자 동작 컨텍스트를 끊지 않도록)
  alert(msg);
}

/* ===================== 초기화 ===================== */
renderWeekSelect();
renderRatingRow();
resetFormState();
renderHistory();
</script>
